interface:
  display_name: "Metacoding Workflow"
  short_description: "Enforce a gated delivery workflow for coding agents"
  default_prompt: "Use $metacoding-workflow to ground in the repo, resume a task whose spec is still in progress or interview me on the open decisions and confirm the scope summary, build one bounded task test-first one ticket at a time, verify, review and close each ticket and wait for my go before the next, update the docs that changed, and close with a VCS handoff or completion confirmation."
